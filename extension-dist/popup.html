<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>ESPOL Horarios</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        background: #f5f5f3;
        color: #1d1d1b;
      }
      .wrap { padding: 16px; }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mark {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        background: #1f4e8c;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .subtitle { font-size: 12px; color: #57564f; margin: 0 0 14px; }
      .notice {
        background: #fdf1ef;
        border: 1px solid #efc2bb;
        color: #7a1a12;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 12px;
        line-height: 1.45;
      }
      .notice button {
        margin-top: 8px;
        width: 100%;
        background: #fff;
        border: 1px solid #cfcdc7;
        color: #1d1d1b;
      }
      .notice button:hover { background: #fafaf8; }
      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: #57564f;
        margin: 10px 0 4px;
      }
      input[type="number"], select, textarea {
        width: 100%;
        background: #fff;
        border: 1px solid #cfcdc7;
        border-radius: 6px;
        color: #1d1d1b;
        padding: 7px 10px;
        font-size: 13px;
        font-family: inherit;
      }
      input[type="number"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #1f4e8c;
        box-shadow: 0 0 0 3px #e8eef7;
      }
      textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
      textarea::placeholder { color: #8a8981; }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      .hint { font-size: 11px; color: #8a8981; margin: 4px 0 0; line-height: 1.45; }
      button {
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 0;
        transition: background-color 0.12s, border-color 0.12s;
      }
      .btn-primary {
        width: 100%;
        margin-top: 14px;
        background: #1f4e8c;
        border-color: #1f4e8c;
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) { background: #183f72; }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-secondary {
        width: 100%;
        margin-top: 8px;
        background: #fff;
        border-color: #cfcdc7;
        color: #1d1d1b;
      }
      .btn-secondary:hover { background: #fafaf8; border-color: #8a8981; }
      .status {
        margin-top: 14px;
        border-top: 1px solid #e3e2de;
        padding-top: 10px;
      }
      .status-title { font-size: 12px; color: #57564f; margin-bottom: 6px; display:flex; justify-content:space-between; }
      .log {
        max-height: 130px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid #e3e2de;
        border-radius: 6px;
        padding: 8px 10px;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #57564f;
      }
      .log div:last-child { color: #1d1d1b; font-weight: 600; }
      .links { display: flex; gap: 8px; margin-top: 8px; }
      .links button { flex: 1; }
      a.linklike { color: #1f4e8c; text-decoration: underline; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>
        <span class="mark" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke-linecap="round"/></svg>
        </span>
        ESPOL Horarios
      </h1>
      <p class="subtitle">Extrae y visualiza horarios sin salir del navegador</p>

      <div id="notice" class="notice" style="display:none"></div>

      <form id="scrape-form">
        <div class="row">
          <div>
            <label for="year">Año</label>
            <input type="number" id="year" min="2000" max="2100" />
          </div>
          <div>
            <label for="term">Término</label>
            <select id="term">
              <option value="1">PAO I</option>
              <option value="2">PAO II</option>
              <option value="0">Vacacional</option>
            </select>
          </div>
        </div>

        <label for="codes">Materias a extraer</label>
        <textarea id="codes" placeholder="ELEG 1028-1052&#10;EYAG 1044&#10;MATG 1032"></textarea>
        <p class="hint">
          Una por línea. "PREFIJO INICIO-FIN" para un rango, o "PREFIJO NUMERO" para una
          materia puntual. Puedes combinar varias líneas con distintos prefijos.
        </p>

        <button type="submit" class="btn-primary" id="btn-start">Iniciar extracción</button>
      </form>

      <div class="links">
        <button class="btn-secondary" id="btn-view">Ver último horario</button>
        <button class="btn-secondary" id="btn-config">Configurar niveles</button>
      </div>

      <div class="status" id="status" style="display:none">
        <div class="status-title"><span id="status-label">Estado</span><span id="status-count"></span></div>
        <div class="log" id="log"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
